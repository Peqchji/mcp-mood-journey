[project]
name = "mood-journey-mcp"
version = "0.1.0"
description = "Local-first mood tracking MCP server"
authors = [{ name = "Peqchji" }]
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server.py", "storage", "tools"]
